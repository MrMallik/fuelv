name: Check, publish, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-checks:
    name: Check deployment scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: |
          for script in deploy-scripts/*.sh; do bash -n "$script"; done
      - name: Validate Compose configuration
        env:
          RELEASE: ${{ github.sha }}
        run: docker compose --env-file .env.production.example config --quiet

  checks:
    name: Check backend and frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Run backend unit tests
        run: python3 -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"

      - name: Install and build Vue frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /fuelv/
        run: |
          npm install
          npm run build

  publish:
    name: Publish release image
    needs: [checks, deployment-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      prefix: ${{ steps.images.outputs.prefix }}
      fuelv_digest: ${{ steps.fuelv.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set image prefix
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish fuelv image
        id: fuelv
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_BASE_PATH=/fuelv/
          tags: ${{ steps.images.outputs.prefix }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fuelv
          cache-to: type=gha,mode=max,scope=fuelv

      - name: Record published release
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          FUELV_DIGEST: ${{ steps.fuelv.outputs.digest }}
          RELEASE: ${{ github.sha }}
        run: |
          {
            printf '## Published release `%s`\n\n' "$RELEASE"
            printf -- '- FuelV: `%s@%s`\n\n' "$IMAGE_PREFIX" "$FUELV_DIGEST"
            printf 'Image targets linux/amd64. Deployment runs in the next job.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://pritabrata.com/fuelv/
    concurrency:
      group: fuelv-production
      cancel-in-progress: false
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Deploy published image
        env:
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}
          FUELV_IMAGE: ${{ needs.publish.outputs.prefix }}@${{ needs.publish.outputs.fuelv_digest }}
        run: bash deploy-scripts/remote-deploy.sh
